name: CI

on:
  push:
    branches: ["*"]
  pull_request:
    branches: [main]

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      gameplay: ${{ steps.filter.outputs.gameplay }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3
        id: filter
        with:
          filters: |
            gameplay:
              - '**/*.gd'
              - '**/*.tscn'
              - '**/*.tres'
              - 'assets/**'
              - 'games/**'
              - 'shaders/**'
              - 'test/**'
              - 'project.godot'
              - '.github/workflows/test.yml'

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install gdtoolkit
        run: pip install gdtoolkit

      - name: Lint GDScript
        run: gdlint scripts/**/*.gd test/**/*.gd

      - name: Check formatting
        run: gdformat --check scripts/**/*.gd test/**/*.gd

  check-openspec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check no open changes in openspec/changes
        run: |
          forbidden=$(find openspec/changes/ -mindepth 1 -maxdepth 1 -type d ! -name archive)
          if [ -n "$forbidden" ]; then
            echo "ERROR: Open changes found in openspec/changes/:"
            echo "$forbidden"
            echo ""
            echo "All changes must be archived before merging."
            echo "Run: openspec archive <change-name>"
            exit 1
          fi
          echo "OK: No open changes in openspec/changes/"

  test:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.gameplay != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Redot binary
        id: cache-redot
        uses: actions/cache@v4
        with:
          path: ~/redot
          key: redot-26.2-stable-linux-x64

      - name: Download Redot
        if: steps.cache-redot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/redot
          curl -L -o ~/redot/redot.zip \
            "https://github.com/Redot-Engine/redot-engine/releases/download/redot-26.2-stable/Redot_v26.2-stable_linux_x64.zip"
          cd ~/redot && unzip redot.zip
          chmod +x ~/redot/redot.linuxbsd.editor.x86_64

      - name: Import project assets
        run: |
          ~/redot/redot.linuxbsd.editor.x86_64 --headless --import

      - name: Run tests
        run: |
          ~/redot/redot.linuxbsd.editor.x86_64 --headless -s test/run_tests.gd
